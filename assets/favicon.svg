<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Frame Gradient: Dark Blue to Vibrant Purple -->
    <linearGradient id="frame-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1329" />
      <stop offset="40%" stop-color="#232f8a" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <!-- Background Gradient: Dark Blue to Deep Purple -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070e24" />
      <stop offset="45%" stop-color="#1e2c88" />
      <stop offset="100%" stop-color="#581c87" />
    </linearGradient>
    <linearGradient id="purple-extrusion" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#4c1d95" />
    </linearGradient>
  </defs>

  <!-- Outer Dark Blue to Purple Transition Frame -->
  <rect x="0" y="0" width="64" height="64" rx="10" fill="url(#frame-grad)" />
  
  <!-- Inner Black Margin -->
  <rect x="2" y="2" width="60" height="60" rx="8" fill="#000000" />
  
  <!-- Circuit Background Gradient -->
  <rect x="4" y="4" width="56" height="56" rx="6" fill="url(#bg-grad)" />

  <!-- Circuit Trace Lines -->
  <g stroke="#000000" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M4 14 L18 14 L24 20 L24 30 L16 38 L4 38" />
    <path d="M22 4 L22 10 L30 18 L46 18 L52 12 L52 4" />
    <path d="M60 26 L48 26 L42 32 L42 46 L48 52 L60 52" />
    <path d="M14 60 L14 48 L22 40 L34 40 L40 46 L40 60" />
    <circle cx="24" cy="20" r="1.5" fill="#0f4bb5" stroke="#000" stroke-width="1" />
    <circle cx="42" cy="32" r="1.5" fill="#8b5cf6" stroke="#000" stroke-width="1" />
  </g>

  <!-- Circular GitHub Octocat Badge -->
  <g transform="translate(32, 32)">
    <!-- Outer shadow ring -->
    <circle cx="0" cy="0" r="18" fill="#000000" />
    <!-- Purple glow ring -->
    <circle cx="0" cy="0" r="16.5" fill="#3b0764" stroke="#8b5cf6" stroke-width="1" />
    <!-- Black core circle -->
    <circle cx="0" cy="0" r="14.5" fill="#000000" />
    <!-- GitHub Octocat Silhouette -->
